services:
  # Backend FastAPI Service
  - type: web
    name: oracle-pyspark-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: APP_URL
        fromService:
          type: web
          name: oracle-pyspark-backend
          property: host
    disk:
      name: db-disk
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    healthCheckPath: /api/health

  # Frontend Static Site
  - type: web
    name: oracle-pyspark-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: oracle-pyspark-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
